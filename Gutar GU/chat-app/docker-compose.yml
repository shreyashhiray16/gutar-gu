version: '3.8'

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ROOM_TOKEN=change-me-long-random-ephemeral
      - PORT=8000
    networks:
      - chat-net

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - chat-net

volumes:
  caddy_data:
  caddy_config:

networks:
  chat-net:
    driver: bridge

